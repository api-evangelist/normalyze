aid: normalyze
name: Normalyze
description: >-
  Normalyze was a data security posture management (DSPM) company that helped
  organizations discover, classify, and protect sensitive data across SaaS,
  PaaS, multi-cloud, on-premises, and hybrid environments, mapping data access
  paths and prioritizing risk. Backed by Battery Ventures and Lightspeed Venture
  Partners, Normalyze was acquired by Proofpoint in 2024 and its capabilities are
  now delivered as part of the Proofpoint Data Security Posture Management
  product line; the normalyze.ai domain redirects to Proofpoint. Normalyze never
  published a standalone public developer portal, API reference, or SDK, so this
  profile has no independent API surface to enrich.
